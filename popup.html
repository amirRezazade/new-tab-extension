<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Save to NovaTab</title>
    <link rel="stylesheet" href="styles/fonts.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup-shell">
      <header class="popup-header">
        <div class="brand-mark" aria-hidden="true">
          <img src="assets/icons/icon48.png" alt="" />
        </div>
        <div class="popup-header__copy">
          <p class="eyebrow">NOVATAB</p>
          <h1>Save this page</h1>
        </div>
        <button class="icon-button" id="refresh-page-button" type="button" aria-label="Refresh current page" title="Refresh page details">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4.7 9a7.5 7.5 0 0 1 12.6-2L20 12M4 17v-5h5m10.3 3a7.5 7.5 0 0 1-12.6 2L4 12" /></svg>
        </button>
      </header>

      <section class="page-card" aria-label="Current page">
        <div class="page-card__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="8.5" />
            <path d="M3.8 12h16.4M12 3.5a13.2 13.2 0 0 1 0 17m0-17a13.2 13.2 0 0 0 0 17" />
          </svg>
        </div>
        <div class="page-card__copy">
          <p class="page-card__label">CURRENT PAGE</p>
          <h2 id="current-page-title">Loading page details…</h2>
          <p class="page-card__url" id="current-page-url">Checking the active tab</p>
        </div>
      </section>

      <form class="save-form" id="save-link-form" novalidate>
        <div class="form-field">
          <label for="tab-select">Dashboard tab</label>
          <div class="select-wrap">
            <select id="tab-select" name="tab" required disabled></select>
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4" /></svg>
          </div>
        </div>

        <div class="form-field">
          <label for="group-select">Group</label>
          <div class="select-wrap">
            <select id="group-select" name="group" required disabled></select>
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4" /></svg>
          </div>
          <p class="field-note" id="group-note" hidden></p>
        </div>

        <div class="form-field new-group-field" id="new-group-field" hidden>
          <label for="new-group-name">New group name</label>
          <input id="new-group-name" name="newGroupName" type="text" maxlength="32" autocomplete="off" placeholder="e.g. Research" disabled />
        </div>

        <div class="form-field">
          <label for="link-title">Link title</label>
          <input id="link-title" name="title" type="text" maxlength="120" autocomplete="off" placeholder="Name this link" required disabled />
        </div>

        <p class="popup-status" id="popup-status" role="status" aria-live="polite" aria-atomic="true"></p>

        <button class="save-button" id="save-link-button" type="submit" disabled>
          <span>Add link</span>
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10h12m-5-5 5 5-5 5" /></svg>
        </button>
      </form>

      <footer class="popup-footer">
        <button class="footer-link" id="open-dashboard-button" type="button">
          <span>Open dashboard</span>
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 12 12 4M5 4h7v7" /></svg>
        </button>
        <span class="footer-hint">Saved on this device</span>
      </footer>
    </main>
    <script type="module" src="popup.js"></script>
    <script>

  </body>
</html>
